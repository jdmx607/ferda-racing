name: Update track cheat sheets

# Rebuilds public/data/* from the latest Next Gen results every Monday (the source
# dataset refreshes Mondays ~5 AM ET during the season, so we run at 12:00 UTC),
# and commits only when something actually changed. Vercel redeploys on the commit.
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '0 12 * 2-11 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-cheatsheet.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-cheatsheet.txt

      - name: Rebuild cheat sheets
        run: python scripts/update_cheat_sheets.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Refresh track cheat sheets"
            git push
          else
            echo "No changes."
          fi
